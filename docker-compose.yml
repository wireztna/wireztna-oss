# WireZTNA Community Edition — production docker-compose
#
# A single-host deployment: control-plane (internal 8443), the SvelteKit UI
# (adapter-node, internal 3000), the broker-agent (host networking, Linux only),
# and an nginx reverse proxy on :80 fronting them.
#
# Conventions (do NOT violate):
#   - Port 8443 is INTERNAL only. nginx on :80 is the single public entrypoint.
#   - The UI build bakes in NO API base URL. It resolves the API from the browser
#     origin at runtime, so the same image works for any IP/host.
#   - sqlite is single-writer: run a single control-plane instance.
#   - The broker-agent manages the host network namespace and WireGuard, so it
#     only works on a LINUX host (not Docker Desktop on macOS/Windows).

services:
  # ─── Control Plane API (internal only) ───
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    expose:
      - "8443"
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── Web UI (adapter-node, internal only; no baked API base URL) ───
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - PROTOCOL_HEADER=X-Forwarded-Proto
      - HOST_HEADER=X-Forwarded-Host
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  # ─── nginx reverse proxy (the single public entrypoint, :80) ───
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/ce.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - control-plane
      - web-ui
    restart: unless-stopped

  # ─── Broker Agent (host networking + NET_ADMIN/SYS_ADMIN; LINUX host only) ───
  broker-agent:
    build:
      context: ./broker
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - /run/netns:/run/netns:shared
    env_file:
      - .env
    environment:
      - CONTROL_PLANE_URL=http://127.0.0.1:8443
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
