<!doctype html>
<html lang="en" data-theme="dark" data-ui="mesh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="WireZTNA — Zero Trust Network Access powered by WireGuard" />
  <meta name="theme-color" content="#0c0d12" />
  <!-- Apply the light/dark theme before first paint to avoid a flash. Mesh is the
       only interface, so data-ui is always "mesh". Dark is the default theme. -->
  <script>
    (function () {
      var root = document.documentElement;

      var theme = 'dark';
      try {
        theme = localStorage.getItem('wireztna_theme') === 'light' ? 'light' : 'dark';
      } catch (e) {
        // Keep the dark default when persistence is unavailable.
      }
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-ui', 'mesh');
    })();
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="WireZTNA" />
  <meta property="og:description" content="Zero Trust Network Access — secure remote access without VPNs" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>WireZTNA</title>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
