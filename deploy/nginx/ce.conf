# WireZTNA Community Edition — nginx reverse proxy (plain HTTP on :80)
#
# Fronts the control-plane API and the SvelteKit UI on a single port. The UI
# resolves the API from the browser origin at runtime, so NO VITE_API_URL is
# baked in anywhere. For TLS, terminate it in front of this proxy and set
# BROKER_PUBLIC_SCHEME=https (or PUBLIC_BASE_URL) in the control-plane env.
#
# Service names (control-plane, web-ui) match the docker-compose.yml network.

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # API
    location /api/ {
        proxy_pass http://control-plane:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health (no auth — for LB/uptime checks)
    location /health {
        proxy_pass http://control-plane:8443;
    }

    # SvelteKit UI (everything else)
    location / {
        proxy_pass http://web-ui:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
